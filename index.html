
<style>
.answer-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.answer-grid label {
  display: block;
  font-weight: bold;
  margin-bottom: 9px;
}

.answer-grid input {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
  background: white;
  color: #1e293b;
}

.answer-grid input[readonly] {
  background: #f1f5f9;
  font-weight: bold;
}

@media (max-width: 650px) {
  .answer-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<section class="card hidden" id="answerSection">
  <h2>Jawaban Murid</h2>

  <p class="muted">
    Isilah berdasarkan ruang sampel di atas.
    Jawaban tidak ditampilkan secara otomatis.
  </p>

  <div class="answer-grid">
    <div>
      <label for="nSAnswer">
        Banyak anggota ruang sampel, n(S)
      </label>
      <input
        id="nSAnswer"
        type="number"
        readonly
        aria-label="Banyak anggota ruang sampel"
      >
    </div>

    <div>
      <label for="nA">
        Banyak anggota kejadian, n(A)
      </label>
      <input
        id="nA"
        type="number"
        min="0"
        step="1"
        placeholder="Masukkan n(A)"
      >
    </div>

    <div>
      <label for="probability">
        Peluang teoretis, P(A)
      </label>
      <input
        id="probability"
        type="text"
        placeholder="Contoh: 1/6"
      >
    </div>
  </div>

  <button
    class="primary"
    onclick="checkAnswer()"
    style="margin-top: 12px"
  >
    Periksa Jawaban
  </button>

  <div id="feedback" class="feedback"></div>
</section>
